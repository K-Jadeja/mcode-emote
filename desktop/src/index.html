<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Claude Pet</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./neutralino.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main id="pet-shell" class="pet-shell" aria-label="Claude Pet demo">
      <header class="session-heading">
        <span id="session-label" hidden></span>
      </header>

      <section class="portrait-stage" aria-label="Pet animation">
        <span class="corner corner-nw" aria-hidden="true"></span>
        <span class="corner corner-ne" aria-hidden="true"></span>
        <span class="corner corner-sw" aria-hidden="true"></span>
        <span class="corner corner-se" aria-hidden="true"></span>
        <img
          id="pet-image"
          class="pet-image"
          width="176"
          height="176"
          alt="Claude Pet is resting"
          draggable="false"
        />
        <span class="activity-signal signal-one" aria-hidden="true"></span>
        <span class="activity-signal signal-two" aria-hidden="true"></span>
        <span class="activity-signal signal-three" aria-hidden="true"></span>
      </section>

      <section class="activity-plate" aria-live="polite">
        <span class="activity-kicker">CLAUDE IS</span>
        <strong id="activity-label" class="activity-label">resting</strong>
      </section>

      <nav id="pet-controls" class="pet-controls" aria-label="Pet controls">
        <button id="pause-button" type="button" aria-label="Pause demo">Ⅱ</button>
        <button id="next-button" type="button" aria-label="Next pose">›</button>
        <button id="close-button" type="button" aria-label="Close Claude Pet">×</button>
      </nav>

      <p id="fatal-error" class="fatal-error" role="alert" hidden></p>
    </main>
  </body>
</html>
